name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

          # Check if version contains -preview, -beta, -rc, or -alpha (NOT -hotfix)
          VERSION_LOWER=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          if [[ "$VERSION_LOWER" == *"-preview"* ]] || [[ "$VERSION_LOWER" == *"-beta"* ]] || [[ "$VERSION_LOWER" == *"-rc"* ]] || [[ "$VERSION_LOWER" == *"-alpha"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Detected pre-release version: $VERSION"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Detected stable version: $VERSION"
          fi

  build-android:
    runs-on: ubuntu-latest
    needs: get-version

    steps:
      - name: Free disk space
        run: |
          # Remove large unused tools (~15GB total). Docker prune was dropped:
          # it took 1-2 minutes and the rm below already frees enough.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare pinned Discord SDK
        uses: ./.github/actions/discord-sdk
        with:
          passphrase: ${{ secrets.DISCORD_MOBILE_SDK_PASSPHRASE }}

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Install Rust binding generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          # Do not publish transforms of the decrypted SDK in shared caches.
          key: gradle-public-dependencies-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-public-dependencies-${{ runner.os }}-

      - name: Cache Android NDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/ndk/30.0.16248370
          key: ndk-30.0.16248370

      - name: Install Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          # Install NDK r30 (supports 16KB page size for Android 15+)
          # Keep the installed platform aligned with compileSdk/targetSdk.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;4.1.2"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release APKs
        run: |
          if [[ "${MORNYE_DISCORD_SDK:-0}" == "1" ]]; then
            bash scripts/build_android.sh --production --target lib/main.dart
          else
            bash scripts/build_android.sh --lite --target lib/main.dart
          fi
          ls -la build/app/outputs/flutter-apk/

      - name: Sign and verify release APKs (V1/V2/V3/V4)
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/mornye-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            : "${KEY_ALIAS:?Missing KEY_ALIAS}"
            : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
            export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          else
            echo "KEYSTORE_BASE64 is not set; generating a standalone release signing key for fork release."
            KEY_ALIAS="release"
            KEYSTORE_PASSWORD="mornyerelease"
            KEY_PASSWORD="mornyerelease"
            keytool -genkeypair -v \
              -keystore "$signing_dir/release.jks" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Mornye, OU=Fork, O=Mornye, L=Fork, S=Fork, C=US"
          fi

          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          apk_dir=build/app/outputs/flutter-apk

          for target in arm64-v8a:arm64 armeabi-v7a:arm32; do
            abi="${target%%:*}"
            label="${target##*:}"
            apk="$apk_dir/Mornye-${VERSION}-${label}.apk"
            "$apksigner" sign \
              --ks "$signing_dir/release.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled true \
              --out "$apk" "$apk_dir/app-${abi}-release.apk"

            # V4 is written beside the APK as "$apk.idsig" for incremental
            # ADB installs; normal installers keep using V1-V3 inside the APK.
            if [ ! -s "$apk.idsig" ]; then
              echo "ERROR: APK signature V4 file was not created: $apk.idsig" >&2
              exit 1
            fi

            # Verify the app's supported Android versions, then explicitly
            # exercise V1 too: the manifest's minSdk 24 normally skips it.
            "$apksigner" verify "$apk"
            report="$("$apksigner" verify --verbose --print-certs --min-sdk-version 21 \
              --v4-signature-file "$apk.idsig" "$apk")"
            for scheme in 1 2 3 4; do
              if ! grep -Eq "Verified using v${scheme} scheme.*: true" <<< "$report"; then
                echo "ERROR: APK signature V${scheme} did not verify: $apk" >&2
                exit 1
              fi
            done
            if grep -qi "Android Debug" <<< "$report"; then
              echo "ERROR: Refusing to publish a debug-signed APK" >&2
              exit 1
            fi
            printf '%s\n' "$report" | grep -E '^Verifies$|^Verified using v[1234] scheme|certificate SHA-256 digest:'
          done

      - name: Audit signed Rust APKs before upload
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_backend_apk.py'
          apk_dir=build/app/outputs/flutter-apk
          discord_flag=""
          if [[ "${MORNYE_DISCORD_SDK:-0}" == "1" ]]; then
            discord_flag="--discord-sdk"
          fi
          python3 scripts/check_backend_apk.py "$apk_dir/Mornye-${VERSION}-arm64.apk" \
            --backend rust --abis arm64-v8a $discord_flag
          python3 scripts/check_backend_apk.py "$apk_dir/Mornye-${VERSION}-arm32.apk" \
            --backend rust --abis armeabi-v7a $discord_flag
          for abi in arm64 arm32; do
            "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 \
              "$apk_dir/Mornye-${VERSION}-${abi}.apk"
          done
          (cd "$apk_dir" && sha256sum Mornye-*.apk > SHA256SUMS.txt)

      - name: Record Android symbol provenance
        run: |
          test -s build/symbols/android/app.android-arm64.symbols
          test -s build/symbols/android/app.android-arm.symbols
          test -s build/app/outputs/mapping/release/mapping.txt
          git rev-parse HEAD > build/symbols/android/commit.txt
          sha256sum build/app/outputs/flutter-apk/Mornye-*.apk > build/symbols/android/apk-sha256.txt

      - name: Retain Android debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-symbols-${{ needs.get-version.outputs.version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/symbols/android/
            build/app/outputs/mapping/release/mapping.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/Mornye-*.apk
            build/app/outputs/flutter-apk/Mornye-*.apk.idsig
            build/app/outputs/flutter-apk/SHA256SUMS.txt

  # Desktop builds package Linux x64 and Windows x64 installers and archives.
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            flutter_arch: x64
            runner: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same build dependencies as desktop.yml, plus the desktop entry and
      # AppStream validators and dpkg-shlibdeps for the deb.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # The image's libunwind-14-dev blocks GStreamer's libunwind-dev
          # dependency; asking for it first lets apt replace the LLVM one.
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config zip file \
            libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-12-dev \
            libjson-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libasound2-dev libclang-dev \
            desktop-file-utils appstream dpkg-dev

      - name: Install rustup
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Build Rust desktop library
        run: bash scripts/build_rust_backend.sh desktop

      - name: Fetch LGPL FFmpeg
        run: bash scripts/fetch_desktop_ffmpeg.sh "linux-${{ matrix.flutter_arch }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      # linux/CMakeLists.txt installs the Rust library into lib/ and the
      # FFmpeg tools staged above into lib/ffmpeg/.
      - name: Build Linux bundle
        run: |
          flutter build linux --release --target lib/main.dart \
            --dart-define="GIT_COMMIT=$(git rev-parse --short=8 HEAD)"

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate linux/packaging/com.zarz.mornye.desktop
          appstreamcli validate --no-net --explain linux/packaging/com.zarz.mornye.metainfo.xml ||
            echo "::warning::AppStream metadata has validation issues"

      - name: Package AppImage and deb
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          FLUTTER_ARCH: ${{ matrix.flutter_arch }}
        run: |
          bundle="build/linux/${FLUTTER_ARCH}/release/bundle"
          test -x "$bundle/mornye"
          test -s "$bundle/lib/libmornye_desktop.so"
          test -x "$bundle/lib/ffmpeg/ffmpeg"
          test -x "$bundle/lib/ffmpeg/ffprobe"
          test -s "$bundle/lib/ffmpeg/LICENSE.txt"
          export MORNYE_PACKAGE_ARCH="$ARCH"
          bash scripts/package_linux.sh appimage "$bundle" "$VERSION" \
            "build/desktop/Mornye-${VERSION}-linux-${ARCH}.AppImage"
          bash scripts/package_linux.sh deb "$bundle" "$VERSION" \
            "build/desktop/Mornye-${VERSION}-linux-${DEB_ARCH}.deb"
          dpkg-deb --contents "build/desktop/Mornye-${VERSION}-linux-${DEB_ARCH}.deb" |
            grep -E 'usr/share/applications/com.zarz.mornye.desktop|usr/lib/mornye/mornye$'
          file "build/desktop/Mornye-${VERSION}-linux-${ARCH}.AppImage"
          (cd build/desktop && sha256sum Mornye-* > "SHA256SUMS-linux-${ARCH}.txt")

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build/desktop/Mornye-*.AppImage
            build/desktop/Mornye-*.deb
            build/desktop/SHA256SUMS-linux-*.txt

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
    needs: get-version
    # The release goes out without Windows assets if this job fails. Remove
    # once a release run of this job is green.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      # Signing runs only once SignPath approves the project and the token is
      # configured; until then the installer ships unsigned.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Build Rust desktop library
        run: ./scripts/build_rust_backend_windows.ps1 -Target ${{ matrix.rust_target }}

      # Git Bash provides curl, unzip and sha256sum for the fetch script.
      - name: Fetch LGPL FFmpeg
        shell: bash
        run: bash scripts/fetch_desktop_ffmpeg.sh windows-${{ matrix.arch }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ matrix.arch }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      # windows/CMakeLists.txt installs the Rust library next to mornye.exe
      # and the FFmpeg tools staged above into ffmpeg\.
      - name: Build Windows app
        run: |
          $commit = git rev-parse --short=8 HEAD
          flutter build windows --release --target lib/main.dart --dart-define="GIT_COMMIT=$commit"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = 'build\windows\${{ matrix.arch }}\runner\Release'
          ./scripts/check_windows_bundle.ps1 -BundleDir $bundle -Arch ${{ matrix.arch }}
          "MORNYE_WINDOWS_BUNDLE=$bundle" >> $env:GITHUB_ENV

      - name: Upload unsigned app for signing
        id: unsigned-app
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned-app-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: build/windows/${{ matrix.arch }}/runner/Release/

      - name: Sign app executables
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/windows-signed

      - name: Use signed app
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          if (-not (Test-Path 'build\windows-signed\mornye.exe')) { throw 'Signed app is missing' }
          "MORNYE_WINDOWS_BUNDLE=build\windows-signed" >> $env:GITHUB_ENV

      - name: Package installer and portable zip
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: ./scripts/package_windows.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }} -BundleDir $env:MORNYE_WINDOWS_BUNDLE

      - name: Upload unsigned installer for signing
        id: unsigned-installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned-installer-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: build/desktop/Mornye-*-setup.exe

      - name: Sign installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/desktop

      - name: Record checksums
        run: |
          $lines = Get-ChildItem build\desktop -File -Filter 'Mornye-*' | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          }
          if (-not $lines) { throw 'No Windows packages were created' }
          [IO.File]::WriteAllText("$PWD\build\desktop\SHA256SUMS-windows-${{ matrix.arch }}.txt", (($lines -join "`n") + "`n"))
          Get-Content build\desktop\SHA256SUMS-windows-${{ matrix.arch }}.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build/desktop/Mornye-*-setup.exe
            build/desktop/Mornye-*-portable.zip
            build/desktop/SHA256SUMS-windows-${{ matrix.arch }}.txt

  # Android and desktop packages publish through their separate release jobs.
  create-release:
    runs-on: ubuntu-latest
    needs: [get-version, build-android]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history needed for git-cliff

      - name: Generate changelog with git-cliff
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: /tmp/changelog.txt

      - name: Show generated changelog
        run: |
          echo "Generated changelog:"
          cat /tmp/changelog.txt

      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: ./release

      # The Android job's checksums are verified, then one SHA256SUMS.txt
      # covering every asset replaces them.
      - name: Verify downloaded artifacts and write SHA256SUMS.txt
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          rm -f SHA256SUMS.txt
          sha256sum Mornye-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare release body
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          CURRENT_REF=$(git rev-list -n 1 "$VERSION" 2>/dev/null || git rev-parse HEAD)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${CURRENT_REF}^" 2>/dev/null || true)

          # Start with git-cliff changelog, but replace its compare footer with a
          # deterministic previous-tag lookup from git.
          sed '/^## [0-9][0-9.[:alpha:]-]*$/d; /^\*\*Full Changelog\*\*/d' /tmp/changelog.txt > /tmp/release_body.txt

          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full Changelog**: [%s...%s](https://github.com/%s/%s/compare/%s...%s)\n' \
              "$PREVIOUS_TAG" "$VERSION" "$REPO_OWNER" "$REPO_NAME" "$PREVIOUS_TAG" "$VERSION" \
              >> /tmp/release_body.txt
          fi

          cat >> /tmp/release_body.txt << FOOTER

          ---

          ### Downloads

          #### Android
          - **arm64**: \`Mornye-${VERSION}-arm64.apk\` (recommended for modern devices)
          - **arm32**: \`Mornye-${VERSION}-arm32.apk\` (older devices)
          - \`*.apk.idsig\`: V4 signatures for \`adb install --incremental\` only; normal installs do not need them

          \`SHA256SUMS.txt\` lists the SHA-256 of every file above.

          ### Installation
          **Android**: Enable "Install from unknown sources" and install the APK
          FOOTER

          echo "Release body:"
          cat /tmp/release_body.txt

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Mornye ${{ needs.get-version.outputs.version }}
          body_path: /tmp/release_body.txt
          files: ./release/*
          draft: false
          prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Desktop packages are released in mornyeapp/Mornye-Desktop, where the
  # desktop updater looks. Releases stay drafts until the repository variable
  # DESKTOP_RELEASES_PUBLIC is 'true', so nothing ships before testing ends.
  create-desktop-release:
    runs-on: ubuntu-latest
    needs: [get-version, build-linux, build-windows]
    # build-windows may fail without blocking the release (continue-on-error).
    if: >-
      ${{ !cancelled()
      && needs.build-linux.result == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history needed for git-cliff

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: /tmp/changelog.txt

      - name: Download desktop packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-release-*
          merge-multiple: true
          path: ./release

      # Each build job's checksums are verified, then one SHA256SUMS.txt
      # covering every asset replaces them. The desktop updater reads it.
      - name: Verify downloaded artifacts and write SHA256SUMS.txt
        run: |
          cd release
          for sums in SHA256SUMS-*.txt; do
            sha256sum --check "$sums"
          done
          rm -f SHA256SUMS-*.txt
          sha256sum Mornye-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare release body
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          CURRENT_REF=$(git rev-list -n 1 "$VERSION" 2>/dev/null || git rev-parse HEAD)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${CURRENT_REF}^" 2>/dev/null || true)

          sed '/^## [0-9][0-9.[:alpha:]-]*$/d; /^\*\*Full Changelog\*\*/d' /tmp/changelog.txt > /tmp/release_body.txt

          # The source and its history live in the main repository.
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full Changelog**: [%s...%s](https://github.com/%s/compare/%s...%s)\n' \
              "$PREVIOUS_TAG" "$VERSION" "$REPOSITORY" "$PREVIOUS_TAG" "$VERSION" \
              >> /tmp/release_body.txt
          fi

          cat >> /tmp/release_body.txt << FOOTER

          Built from [${REPOSITORY}@${VERSION}](https://github.com/${REPOSITORY}/tree/${VERSION}).

          ---

          ### Downloads
          | OS | Download | Notes |
          |---|---|---|
          FOOTER

          # Rows list only the packages this run produced (Windows is
          # optional until its job is proven).
          desktop_row() {
            if [ -f "release/$2" ]; then
              printf "| %s | \`%s\` | %s |\n" "$1" "$2" "$3" >> /tmp/release_body.txt
            fi
          }
          desktop_row "Windows" "Mornye-${VERSION}-windows-x64-setup.exe" "Installer (x64), no administrator rights needed"
          desktop_row "Windows" "Mornye-${VERSION}-windows-x64-portable.zip" "Portable (x64): extract and run mornye.exe"
          desktop_row "Linux" "Mornye-${VERSION}-linux-x86_64.AppImage" "AppImage (x86_64), updates itself"
          desktop_row "Linux" "Mornye-${VERSION}-linux-amd64.deb" "Debian/Ubuntu (amd64)"

          cat >> /tmp/release_body.txt << FOOTER

          \`SHA256SUMS.txt\` lists the SHA-256 of every file above.

          ### Installation
          **Windows**: Run the setup. The installer is not code signed yet, so SmartScreen may warn: click "More info", then "Run anyway".
          **Linux**: AppImage: \`chmod +x\` the file and run it. deb: \`sudo apt install ./Mornye-${VERSION}-linux-amd64.deb\`; deb installs update through new releases.
          FOOTER

          echo "Release body:"
          cat /tmp/release_body.txt

      - name: Create desktop release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: ${{ secrets.MORNYE_DESKTOP_RELEASE_TOKEN != '' && 'mornyeapp/Mornye-Desktop' || github.repository }}
          token: ${{ secrets.MORNYE_DESKTOP_RELEASE_TOKEN != '' && secrets.MORNYE_DESKTOP_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Mornye ${{ needs.get-version.outputs.version }}
          body_path: /tmp/release_body.txt
          files: ./release/*
          draft: ${{ vars.DESKTOP_RELEASES_PUBLIC != 'true' && secrets.MORNYE_DESKTOP_RELEASE_TOKEN != '' }}
          prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}

  notify-telegram:
    runs-on: ubuntu-latest
    needs: [get-version, create-release]
    if: ${{ !cancelled() && needs.create-release.result == 'success' && needs.get-version.outputs.is_prerelease != 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: ./release

      - name: Generate changelog with git-cliff for Telegram
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: /tmp/cliff_tg.txt

      - name: Convert changelog for Telegram
        id: changelog
        run: |
          if [ ! -s /tmp/cliff_tg.txt ]; then
            echo "See release notes on GitHub for details." > /tmp/changelog.txt
          else
            # Convert Markdown to Telegram HTML
            CHANGELOG=$(cat /tmp/cliff_tg.txt | \
              sed '/^## [0-9][0-9.[:alpha:]-]*$/d' | \
              sed '/^\*\*Full Changelog\*\*/d' | \
              sed 's/ by \[@[^]]*\](https:\/\/github\.com\/[^)]*)//g' | \
              sed 's/ by @[A-Za-z0-9_-]\+//g' | \
              sed 's/\[#\([0-9]*\)\]([^)]*)/#\1/g' | \
              sed 's/\[@\([^]]*\)\]([^)]*)/@\1/g' | \
              sed 's/&/\&amp;/g' | \
              sed 's/</\&lt;/g' | \
              sed 's/>/\&gt;/g' | \
              sed 's/\*\*\([^*]*\)\*\*/<b>\1<\/b>/g' | \
              sed 's/^### \(.*\)$/<b>\1<\/b>/g' | \
              sed 's/^## \(.*\)$/<b>\1<\/b>/g' | \
              sed 's/^- /• /g')

            # Truncate for Telegram 4096 char limit
            CHANGELOG=$(echo "$CHANGELOG" | head -c 2500 | sed '$d')
            echo "$CHANGELOG" > /tmp/changelog.txt
          fi

          echo "Telegram changelog:"
          cat /tmp/changelog.txt

      - name: Send to Telegram Channel
        if: env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: '@mornyeupdates'
          VERSION: ${{ needs.get-version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          CHANGELOG=$(cat /tmp/changelog.txt)

          ARM64_APK=$(find ./release -name "*arm64*.apk" | head -1)
          ARM32_APK=$(find ./release -name "*arm32*.apk" | head -1)

          # Prepare message with changelog (HTML format)
          printf '%s\n' \
            "<b>Mornye ${VERSION} Released!</b>" \
            "" \
            "<b>What's New:</b>" \
            "${CHANGELOG}" \
            "" \
            "<a href=\"https://github.com/${REPOSITORY}/releases/tag/${VERSION}\">View Release Notes</a>" \
            > /tmp/telegram_message.txt

          MESSAGE=$(cat /tmp/telegram_message.txt)

          # Send message first (using HTML parse mode)
          # Use --data-urlencode for proper encoding of special chars (+, &, etc.)
          # Use || true to ensure file uploads continue even if message fails
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" || true

          if [ -f "$ARM64_APK" ]; then
            echo "Uploading arm64 APK to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHANNEL_ID}" \
              -F document=@"${ARM64_APK}" \
              -F caption="Mornye ${VERSION} - arm64 (recommended)"
          fi

          if [ -f "$ARM32_APK" ]; then
            echo "Uploading arm32 APK to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHANNEL_ID}" \
              -F document=@"${ARM32_APK}" \
              -F caption="Mornye ${VERSION} - arm32"
          fi

          echo "Telegram notification sent!"
